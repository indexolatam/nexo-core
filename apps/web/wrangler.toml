# NEXO core template.
# create-client.js reemplaza automáticamente estos valores en cada cliente.
name = "nexo-core"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "nexo-core_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[d1_databases]]
binding = "DB_AUDIT"
database_name = "nexo-core_audit_db"
database_id = "REPLACE_WITH_D1_AUDIT_DATABASE_ID"
